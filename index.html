<style>

.st .em{font-size:22px;line-height:1;margin-bottom:4px}
.scimg{width:100%;aspect-ratio:4/3;border-radius:14px;background:var(--sec) center/contain no-repeat;cursor:pointer;margin:8px 0}

.pn{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 12px}.pn .ib{width:34px;height:34px}
.lr{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer}.dc{width:46px;height:46px;border-radius:14px;background:var(--sec);display:grid;place-items:center;text-align:center;line-height:1.1;flex:none}.dc b{font-size:17px}.dc small{font-size:10px;color:var(--mut)}
.lm{flex:1;min-width:0}.lm>b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chips span{font-size:11.5px;background:var(--bg);border-radius:99px;padding:2px 8px;color:var(--mut)}
.la{font-weight:700;color:#b9755a;white-space:nowrap}.mh{display:flex;justify-content:space-between;margin:16px 4px 6px;font-size:13px;color:var(--mut)}
.cb{margin:12px 0}.cr{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
</style></head><body>

const sorted=()=>[...D.rounds].sort((a,b)=>b.date.localeCompare(a.date)),feeSum=r=>Object.values(r.fees||{}).reduce((a,b)=>a+(+b||0),0),total=r=>r.total!=null?+r.total:feeSum(r),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

const FEES={green:'그린피',cart:'카트비',caddie:'캐디피',food:'식사·음료',move:'교통비',etc:'기타'},WX=['☀️ 맑음','⛅ 구름 많음','☁️ 흐림','🌧️ 비','❄️ 눈'];

const THUMB=[['#E4ECE1','⛳'],['#F3E3DA','🏌️‍♀️'],['#E6E9F0','🌤️'],['#F1EAD6','🏆'],['#E3EEE9','🌿'],['#EFE1E6','🎯']],WXBG={'☀️':'#F6EBC9','⛅':'#E9EEF0','☁️':'#E3E6E8','🌧️':'#DCE6EE','❄️':'#EAF1F6'};

Object.assign(window,{v:'home',arg:null,F:{},cm:new Date(),sel:null,per:'m',ey:new Date().getFullYear(),em:new Date().getMonth()+1,q:'',so:'date',busy:0});

$('#nav').innerHTML=[['home','home','홈'],['rounds','cal','라운드'],['form','plus',''],['progress','up','스코어'],['exp','wallet','지출']].filter(x=>!(isRO()&&x[0]=='form')).map(([k,i,l])=>`<button class="${k=='form'?'plus':''} ${t==k?'on':''}" onclick="go('${k}')" aria-label="${l||'새 라운드'}">${I(i,k=='form'?26:22)}${l}</button>`).join('');

function pgHtml(R){const n=R.photos.length;return`<div class="pg">`+R.photos.map((p,i)=>{let sp=2,ar='1/1';if(n==1){sp=6;ar='4/3'}else if(n==2){sp=3}else if(n==3){if(i==0){sp=6;ar='16/9'}else{sp=3;ar='4/3'}}else if(n==4){sp=3}else{const full=n-n%3,m=n%3;if(i>=full){if(m==1){sp=6;ar='16/9'}else{sp=3;ar='4/3'}}}return`<div style="grid-column:span ${sp};aspect-ratio:${ar};background-image:url(${ps(p)})" onclick="zoom('${R.id}',${i})"></div>`}).join('')+'</div>'}

const V={
home(){const s=sorted(),sc=s.map(r=>r.score).filter(x=>x!=null),ph=s.flatMap(r=>(r.photos||[]).map(p=>({...p,id:r.id}))).slice(0,12),msg=!s.length?'첫 라운딩을 기다리고 있어요':s.length<5?'차곡차곡 추억이 쌓이는 중이에요':'꾸준한 라운딩, 정말 멋져요',e2=!s.length?'🌤️':s.length<5?'🌱':'🏆';
return`<div class="top"><div><h1>⛳ JM's Green Book</h1><p>정민이의 필드 기록장</p></div>${isRO()?'':`<button class="ib" onclick="go('set')" aria-label="설정">${I('gear',20)}</button>`}</div>${BOOTERR?`<div class="status">연결 문제: ${esc(BOOTERR)}</div>`:''}
<div class="hero2"><div><div class="lab">오늘의 한마디</div><b>${msg}</b></div><div class="hb">🏌️‍♀️</div></div>
${ROLE=='admin'?(PV?`<div class="status" style="justify-content:space-between"><span>방문자 화면 미리보기</span><button class="btn sec" style="min-height:34px;padding:4px 12px" onclick="exitPv()">관리자 화면으로</button></div>`:`<div class="status" style="justify-content:space-between"><span>관리자 모드</span><button class="btn sec" style="min-height:34px;padding:4px 12px" onclick="previewPub()">방문자 화면 미리보기</button></div>`):''}

<h2>Little Memories</h2>${ph.length?`<div class="hs">${ph.map(p=>`<div style="background-image:url(${ps(p)})" onclick="go('detail','${p.id}')"></div>`).join('')}</div>`:`<div class="card empty" style="padding:16px">${isRO()?'공개된 사진이 아직 없어요.':'사진을 추가하면 이곳에 추억이 모여요.'}</div>`}${ROLE=='visitor'&&SB?`<p style="text-align:center;margin-top:24px"><a href="#" class="lab" onclick="go('login');return false">관리자 로그인</a></p>`:''}`},
set(){return`<div class="top"><h1>설정</h1><button class="ib" onclick="go('home')" aria-label="닫기">${I('l',20)}</button></div>${cloudCard()}<h2>백업 · 복원</h2><div class="card"><div class="note" style="margin:0 0 8px">기록은 이 브라우저에만 저장돼요. 기기 간 자동 동기화는 지원하지 않아요. 백업 텍스트를 복사해 보관하고, 필요할 때 붙여넣어 복원하세요.</div><textarea id="bk" rows="4" placeholder="복원할 백업 JSON을 붙여넣기"></textarea><div class="row" style="margin-top:8px"><button class="btn sec" onclick="bkc()">백업 복사</button><button class="btn sec" onclick="bkr()">복원</button></div></div>`},

const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),pm=`${y}-${pad(m+1)}`,mr=D.rounds.filter(r=>r.date.startsWith(pm));let c='';

async function saveRound(){if(ROLE=='visitor')return;const r=F.r,date=$('#f-date').value,course=$('#f-course').value.trim(),score=+$('#f-score').value;
if(!date)return toast('날짜를 선택해 주세요.');if(!course)return toast('골프장 이름을 입력해 주세요.');if(!(score>=18&&score<=200))return toast('스코어는 18~200 사이로 입력해 주세요.');const fr=+$('#f-front').value||null,bk=+$('#f-back').value||null;if(fr&&bk&&fr+bk!==score)return toast('전반+후반 합계('+(fr+bk)+')와 총 스코어가 달라요.');

const n={...r,id:r.id||String(Date.now()),date,teeoff:$('#f-tee').value||'',course,region:$('#f-region').value.trim(),mates:F.mates,score,par:+$('#f-par').value||72,wx:$('#f-wx').value,temp:$('#f-temp').value,wind:$('#f-wind').value,fees,holes:holes.some(x=>x)?holes:null,good:$('#f-good').value.trim(),bad:$('#f-bad').value.trim(),goals:F.goals,photos:F.photos,scorecard:F.sc||null,front:fr,back:bk,pub:anyVis(F.vis),vis:F.vis,total:tot,etcNote:$('#f-etcnote').value.trim(),lat:F.place?.lat??null,lng:F.place?.lng??null,address:F.place?.address||''};

async function cloudSave(r){const{data:{session}}=await SB.auth.getSession(),uid=session.user.id,old=D.rounds.find(x=>x.id==r.id),ph=[];
for(const p of r.photos||[]){if(p.src){const path=`${uid}/${r.id}/${Date.now()}-${ph.length}.jpg`,blob=await(await fetch(p.src)).blob(),{error}=await SB.storage.from('media').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;UC[path]=p.src;ph.push(p.hide?{path,hide:true}:{path})}else ph.push(p.hide?{path:p.path,hide:true}:{path:p.path})}
