<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>My Golf Diary</title>
<style>

:root{--bg:#FAF8F4;--card:#fff;--pri:#91A58E;--sec:#EEE9E1;--acc:#D9A58F;--tx:#343832;--mut:#8b8d85;--sh:0 2px 14px rgba(52,56,50,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 "Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:18px 18px 8px;animation:in .28s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1,h2,h3,.n{font-family:inherit;font-weight:600;margin:0}h1{font-size:24px}h2{font-size:17px;margin:26px 2px 10px}h3{font-size:15px;margin-bottom:8px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.lab{color:var(--mut);font-size:12.5px}.n{font-size:26px;line-height:1.15}.up{color:var(--pri)}.dn{color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:flex-start}.top p{margin:2px 0 0;color:var(--mut);font-style:normal;font-size:13px}
.ib{background:var(--sec);border:0;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;color:var(--tx);cursor:pointer}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st .card{margin:0;padding:12px 6px;text-align:center}
.rc{display:flex;gap:12px;align-items:center;cursor:pointer;padding:10px;transition:transform .15s}.rc:active{transform:scale(.98)}
.ph{width:84px;height:84px;border-radius:16px;background:var(--sec) center/cover;display:grid;place-items:center;color:var(--pri);flex:none}
.rc .b{flex:1;min-width:0}.rc .b b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rc .sc{text-align:right;padding-right:6px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:10px 16px;min-height:44px;cursor:pointer;transition:transform .12s,opacity .12s}.btn:active{transform:scale(.96);opacity:.85}.btn.sec{background:var(--sec);color:var(--tx)}.btn.del{background:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--sec);border-radius:12px;padding:11px 12px;min-height:44px}
label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 4px}.row{display:flex;gap:8px}.row>*{flex:1}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--sec);border-radius:99px;padding:4px 12px;margin:4px 6px 0 0;font-size:13px}.tag b{cursor:pointer;padding:0 2px}
.seg2{display:inline-flex;background:var(--sec);border-radius:99px;padding:3px;margin:4px 0 10px}.seg2 button{border:0;background:none;border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;min-height:34px;color:var(--mut)}.seg2 button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);border-top:1px solid var(--sec);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);cursor:pointer;min-width:56px;min-height:44px;position:relative}.nav button.on{color:var(--pri);font-weight:600}.nav button.on:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--pri);position:absolute;bottom:-5px}
.nav .plus{background:var(--pri);color:#fff;border-radius:50%;width:54px;height:54px;min-width:0;margin-top:-20px;justify-content:center;box-shadow:0 4px 14px rgba(145,165,142,.5)}.nav .plus:after{display:none}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -18px;padding:0 18px 6px}.hs>div{flex:none;width:130px;height:130px;border-radius:18px;background:var(--sec) center/cover;scroll-snap-align:start;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal>div{min-height:48px;cursor:pointer;border-radius:12px;padding-top:4px}.cal i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:13px}.cal .has i{background:var(--pri);color:#fff}.cal small{display:block;font-size:10px;color:var(--mut)}.cal .sel{background:var(--sec)}
.bar{height:8px;background:var(--sec);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos div{aspect-ratio:1;border-radius:14px;background:var(--sec) center/cover;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(30,32,28,.88);z-index:9;display:grid;place-items:center;padding:16px;color:#fff;text-align:center}.ov img{max-width:100%;max-height:80vh;border-radius:14px}
.empty{text-align:center;color:var(--mut);padding:26px 12px}.empty svg{margin-bottom:6px}
.status{display:flex;gap:10px;align-items:center;background:var(--sec);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mut);margin-top:10px}
.big{width:100%;font-family:inherit;font-size:44px;text-align:center;border:0;background:var(--bg);padding:10px;border-radius:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--tx);color:#fff;padding:9px 18px;border-radius:99px;z-index:10;font-size:13px;animation:in .2s}
.note{font-size:12px;color:var(--mut);margin-top:6px}svg text{fill:var(--mut);font-size:10px}summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sg{background:var(--card);border:1px solid var(--sec);border-radius:12px;padding:10px 12px;margin-top:4px;font-size:14px;cursor:pointer}.sg:active{background:var(--sec)}.map{width:100%;height:150px;border:0;border-radius:14px;margin-top:8px;display:block}
</style></head><body>
<main id="m"></main><nav class="nav" id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=3"></script>
<script>
const mapsEnabled=false,suggest=0,pickPlace=0,weatherFor=0,embedUrl=0,mapLink=()=>'#';

const $=s=>document.querySelector(s);
const P={home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',plus:'<path d="M5 12h14M12 5v14"/>',up:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',l:'<path d="m15 18-6-6 6-6"/>',r:'<path d="m9 18 6-6-6-6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',flag:'<path d="M4 22V4M4 4h13l-3 4 3 4H4"/>',pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/>'};
const I=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const BALL=`<svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#91A58E" stroke-width="2" stroke-linecap="round"><circle cx="32" cy="26" r="16" fill="#fff"/><circle cx="26" cy="22" r="1.5"/><circle cx="33" cy="19" r="1.5"/><circle cx="36" cy="28" r="1.5"/><circle cx="27" cy="30" r="1.5"/><path d="M28 42h8l-3 14h-2z" stroke="#D9A58F"/></svg>`;
const CFG=window.GD_CONFIG||{},SB=CFG.url&&CFG.key&&window.supabase?window.supabase.createClient(String(CFG.url).trim().replace(/\/(rest|auth|storage)\/v1.*$/,'').replace(/\/+$/,''),String(CFG.key).trim(),{auth:{lock:async(n,ms,fn)=>await fn()}}):null;
let D={rounds:[]};try{D=JSON.parse(localStorage.getItem('mgd')||'{"rounds":[]}');if(!Array.isArray(D.rounds))D.rounds=[]}catch(e){}
const LOCAL=JSON.parse(JSON.stringify(D));if(SB)D={rounds:[]};
function save(){if(SB)return;try{localStorage.setItem('mgd',JSON.stringify(D))}catch(e){toast('저장 공간이 부족해요. 백업 후 사진을 정리해 주세요.')}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR'),fd=d=>d.replaceAll('-','.');
const sorted=()=>[...D.rounds].sort((a,b)=>b.date.localeCompare(a.date)),feeSum=r=>Object.values(r.fees||{}).reduce((a,b)=>a+(+b||0),0),total=r=>r.total!=null?+r.total:feeSum(r),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const prevOf=r=>sorted().find(x=>x.id!=r.id&&(x.date<r.date||(x.date==r.date&&x.id<r.id)));
const FEES={green:'그린피',cart:'카트비',caddie:'캐디피',food:'식사·음료',move:'교통비',etc:'기타'},WX=['☀️ 맑음','⛅ 구름 많음','☁️ 흐림','🌧️ 비','❄️ 눈'];
const pad=n=>String(n).padStart(2,'0');
Object.assign(window,{v:'home',arg:null,F:{},cm:new Date(),sel:null,per:'m',ey:new Date().getFullYear(),em:new Date().getMonth()+1,q:'',so:'date',busy:0});
function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2000)}
function go(x,a,b){v=x;arg=a;if(x=='form')startForm(a,b);render();scrollTo(0,0)}
function render(){if(ROLE=='visitor'&&v!='login')v='pub';$('#nav').style.display=ROLE=='visitor'?'none':'';const t=v=='form'?'form':v=='detail'?'rounds':v=='set'?'home':v;
$('#nav').innerHTML=[['home','home','홈'],['rounds','cal','라운드'],['form','plus',''],['progress','up','스코어'],['exp','wallet','지출']].map(([k,i,l])=>`<button class="${k=='form'?'plus':''} ${t==k?'on':''}" onclick="go('${k}')" aria-label="${l||'새 라운드'}">${I(i,k=='form'?26:22)}${l}</button>`).join('');
const m=$('#m');m.style.animation='none';m.offsetWidth;m.style.animation='';m.innerHTML=V[v](arg);if(v=='form'){tags();goalsUI();photosUI();sum();restore();mapUI();wxUI()}urls()}
const wxs=r=>r.wx?`${r.wx}${r.temp?' '+r.temp+'°':''}`:'';
const card=r=>{const p=prevOf(r),d=p?r.score-p.score:null,img=ps(r.photos?.[0]),mt=(r.mates||[]).join(', ');
return`<div class="card rc" onclick="go('detail','${r.id}')"><div class="ph" style="${img?`background-image:url(${img})`:''}">${img?'':I('flag',28)}</div><div class="b"><div class="lab">${fd(r.date)}</div><b>${esc(r.course)}${SB&&r.pub?' 🌐':''}</b><div class="lab">${[wxs(r),mt&&'동반 '+esc(mt)].filter(Boolean).join(' · ')||'&nbsp;'}</div></div><div class="sc"><div class="n">${r.score}</div>${d!==null?`<div class="lab ${d<=0?'up':'dn'}">${d==0?'동일':(d<0?'▼ ':'▲ ')+Math.abs(d)}</div>`:''}</div></div>`};
const empty=(t,b='첫 라운드 기록하기')=>`<div class="card empty">${BALL}<p>${t}</p>${b?`<button class="btn" onclick="go('form')">${b}</button>`:''}</div>`;
const V={
home(){const s=sorted(),sc=s.map(r=>r.score),rec=sc.slice(0,5),g=D.goal?.score,ph=s.flatMap(r=>(r.photos||[]).map(p=>({...p,id:r.id}))).slice(0,12),a5=avg(rec);
return`<div class="top"><div><h1>My Golf Diary</h1><p>Every round has a story.</p></div><button class="ib" onclick="go('set')" aria-label="설정">${I('gear',20)}</button></div>
${ROLE=='admin'?`<div class="status" style="justify-content:space-between"><span>관리자 모드</span><button class="btn sec" style="min-height:34px;padding:4px 12px" onclick="previewPub()">공개 페이지 미리보기</button></div>`:''}<h2>My Golf Journey</h2><div class="st"><div class="card"><div class="n">${s.length}</div><div class="lab">라운딩</div></div><div class="card"><div class="n">${sc.length?Math.min(...sc):'-'}</div><div class="lab">베스트</div></div><div class="card"><div class="n">${sc.length?avg(sc).toFixed(1):'-'}</div><div class="lab">평균</div></div></div>
<h2>최근 라운딩</h2>${s.length?s.slice(0,3).map(card).join(''):empty('아직 기록이 없어요. 첫 라운드를 남겨볼까요?')}
<h2>Little Memories</h2>${ph.length?`<div class="hs">${ph.map(p=>`<div style="background-image:url(${ps(p)})" onclick="go('detail','${p.id}')"></div>`).join('')}</div>`:`<div class="card empty" style="padding:16px">사진을 추가하면 이곳에 추억이 모여요.</div>`}`},
set(){return`<div class="top"><h1>설정</h1><button class="ib" onclick="go('home')" aria-label="닫기">${I('l',20)}</button></div>${cloudCard()}<h2>백업 · 복원</h2><div class="card"><div class="note" style="margin:0 0 8px">기록은 이 브라우저에만 저장돼요. 기기 간 자동 동기화는 지원하지 않아요. 백업 텍스트를 복사해 보관하고, 필요할 때 붙여넣어 복원하세요.</div><textarea id="bk" rows="4" placeholder="복원할 백업 JSON을 붙여넣기"></textarea><div class="row" style="margin-top:8px"><button class="btn sec" onclick="bkc()">백업 복사</button><button class="btn sec" onclick="bkr()">복원</button></div></div>`},
rounds(){const cal=arg!='list';let s=sorted().filter(r=>!q||(r.course+(r.mates||[]).join(' ')).includes(q));if(so=='score')s.sort((a,b)=>a.score-b.score);
const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),pm=`${y}-${pad(m+1)}`,mr=D.rounds.filter(r=>r.date.startsWith(pm));let c='';
for(let i=0;i<f;i++)c+='<div></div>';for(let d=1;d<=n;d++){const k=`${pm}-${pad(d)}`,r=D.rounds.find(x=>x.date==k);c+=`<div class="${r?'has':''} ${sel==k?'sel':''}" onclick="sel='${k}';render()"><i>${d}</i><small>${r?r.score:'&nbsp;'}</small></div>`}
const sr=sel&&sel.startsWith(pm)?D.rounds.filter(r=>r.date==sel):[];
return`<h2 style="margin-top:6px">라운드 기록</h2><div class="seg2"><button class="${cal?'on':''}" onclick="go('rounds')">캘린더</button><button class="${cal?'':'on'}" onclick="go('rounds','list')">리스트</button></div>`+
(cal?`<div class="card"><div class="row" style="align-items:center;justify-content:center;gap:4px"><button class="ib" style="flex:none;width:36px;height:36px" onclick="cm=new Date(${y},${m-1},1);render()" aria-label="이전 달">${I('l',18)}</button><b style="text-align:center" class="n" >${y}년 ${m+1}월</b><button class="ib" style="flex:none;width:36px;height:36px" onclick="cm=new Date(${y},${m+1},1);render()" aria-label="다음 달">${I('r',18)}</button></div><div class="cal" style="margin-top:10px">${['일','월','화','수','목','금','토'].map(d=>`<div class="lab" style="cursor:default;min-height:0">${d}</div>`).join('')}${c}</div></div>
${sel&&sel.startsWith(pm)?(sr.length?sr.map(card).join(''):`<div class="card empty" style="padding:16px"><p>${fd(sel)}에는 기록이 없어요.</p><button class="btn" onclick="go('form',null,'${sel}')">이 날짜로 기록하기</button></div>`):''}
<div class="card"><div class="lab">${m+1}월 요약</div><b>${mr.length}회 라운딩${mr.length?' · 평균 '+avg(mr.map(r=>r.score)).toFixed(1)+'타':''}</b></div>`:
`<div class="row"><input placeholder="골프장·동반자 검색" value="${esc(q)}" onchange="q=this.value;render()"><select style="flex:none;width:110px" onchange="so=this.value;render()"><option value="date">최근순</option><option value="score" ${so=='score'?'selected':''}>스코어순</option></select></div><div style="margin-top:10px">${s.length?s.map(card).join(''):empty('조건에 맞는 기록이 없어요.')}</div>`)},
detail(id){const r=D.rounds.find(x=>x.id==id);if(!r)return empty('기록을 찾을 수 없어요.','');const p=prevOf(r),d=p?r.score-p.score:null,op=r.score-(r.par||72);
return`<div class="top"><button class="ib" onclick="go('rounds')" aria-label="뒤로">${I('l',20)}</button></div><div class="card" style="margin-top:12px"><div class="lab">${fd(r.date)}${r.region?' · '+esc(r.region):''}</div><h1>${esc(r.course)}</h1>${SB?`<span class="tag" style="margin:6px 0 0">${r.pub?'🌐 Public':'🔒 Private'}</span>`:''}<div class="n" style="font-size:44px;margin-top:8px">${r.score} <span class="lab">${op>=0?'+':''}${op} (파 ${r.par||72})</span></div>
${d!==null?`<p class="${d<=0?'up':'dn'}">직전 라운드 ${p.score} → ${d==0?'동일':d<0?Math.abs(d)+'타 줄였어요':d+'타 늘었어요'}</p>`:''}${r.wx?`<p class="lab">${r.wx}${r.temp?' · '+r.temp+'°C':''}${r.wind?' · 바람 '+r.wind+'km/h':''}</p>`:''}${r.lat!=null?`<p class="lab"><a href="${mapLink(r.lat,r.lng)}" target="_blank" rel="noopener" style="color:var(--pri)">${esc(r.address||'지도에서 보기')}</a></p>`:''}${(r.mates||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
<div class="card"><h3>비용 ${won(total(r))}</h3>${(()=>{const e=Object.entries(r.fees||{}).filter(e=>+e[1]),rs=Math.max(0,total(r)-feeSum(r)),s=e.map(([k,x])=>`<div class="row"><span>${FEES[k]}${k=='etc'&&r.etcNote?' ('+esc(r.etcNote)+')':''}</span><span style="text-align:right">${won(x)}</span></div>`).join('')+(e.length&&rs>0?`<div class="row"><span>미분류</span><span style="text-align:right">${won(rs)}</span></div>`:'');return s||(total(r)?'':'<p class="lab">입력된 비용이 없어요</p>')})()}</div>
${['good','bad'].map((k,i)=>r[k]?`<div class="card"><h3>${i?'What Could Be Better':'What Went Well'}</h3><p style="white-space:pre-wrap;margin:0">${esc(r[k])}</p></div>`:'').join('')}
${r.goals?.length?`<div class="card"><h3>Next Round Goals</h3>${r.goals.map((g,i)=>`<label style="margin:4px 0;color:inherit;font-size:15px"><input type="checkbox" style="width:auto;min-height:0" ${g.done?'checked':''} onchange="tg('${r.id}',${i})"> ${esc(g.t)}</label>`).join('')}</div>`:''}
<div class="card"><h3>Photos & Memories</h3>${r.photos?.length?`<div class="photos">${r.photos.map((p,i)=>`<div style="background-image:url(${ps(p)})" onclick="zoom('${r.id}',${i})"></div>`).join('')}</div>`:'<p class="lab">사진은 수정 화면에서 추가할 수 있어요.</p>'}</div>
<div class="row"><button class="btn" onclick="go('form','${r.id}')">수정</button><button class="btn del" onclick="del('${r.id}')">삭제</button></div>`},

async function login(){const{error}=await SB.auth.signInWithPassword({email:$('#lg-email').value.trim(),password:$('#lg-pw').value});if(error)return alert('로그인 실패: '+error.message+'\n\n(Invalid login credentials = 이메일/비밀번호 불일치, Email not confirmed = 계정 인증 필요, Invalid API key = config.js 키 오류)');const r=await SB.rpc('is_admin');if(r.error)return alert('권한 확인 실패: '+r.error.message+'\n\nSQL 설정(supabase.sql)이 모두 실행됐는지 확인해 주세요.');if(r.data!==true){await SB.auth.signOut();return alert('로그인은 됐지만 관리자로 등록되지 않은 계정이에요. SQL Editor에서 admins 등록 쿼리를 다시 실행해 주세요.')}ROLE='admin';await pull();go('home')}
async function logout(){await SB.auth.signOut();ROLE='visitor';D={rounds:[]};await loadPublic();go('pub')}
async function previewPub(){await loadPublic();go('pub')}
async function importLocal(){const ex=new Set(D.rounds.map(r=>r.id)),todo=LOCAL.rounds.filter(r=>!ex.has(r.id));if(!todo.length)return toast('가져올 새 기록이 없어요.');if(!confirm(`${todo.length}건을 클라우드로 가져올까요? 이 브라우저의 기록은 그대로 유지돼요. 가져온 기록은 모두 비공개로 시작해요.`))return;let n=0;for(const r of todo){try{const c=structuredClone(r);c.pub=false;c.vis={};toast(`가져오는 중… ${n+1}/${todo.length}`);await cloudSave(c);D.rounds.push(c);n++}catch(e){toast('중간에 실패했어요: '+(e.message||e));break}}toast(`${n}건 가져왔어요`);render()}
const VIS=[['photos','사진'],['mates','동반자'],['good','잘한 점'],['bad','아쉬운 점'],['goals','다음 목표']];
function visUI(){return`<div class="seg2"><button class="${F.pub?'':'on'}" onclick="setPub(false)">🔒 Private</button><button class="${F.pub?'on':''}" onclick="setPub(true)">🌐 Public</button></div>${F.pub?`<div class="note" style="margin:0 0 6px">날짜·골프장·스코어가 공개돼요. 비용은 어떤 경우에도 공개되지 않아요.</div>`+VIS.map(([k,l])=>`<label style="color:inherit;font-size:15px;margin:6px 0"><input type="checkbox" style="width:auto;min-height:0" ${F.vis[k]?'checked':''} onchange="F.vis['${k}']=this.checked"> ${l} 공개</label>`).join(''):'<div class="note" style="margin:0">비공개 기록은 나만 볼 수 있어요.</div>'}`}
function setPub(b){F.pub=b;$('#vz').innerHTML=visUI()}
function cloudCard(){if(!SB)return`<h2>클라우드</h2><div class="card"><div class="note" style="margin:0">Supabase가 설정되지 않아 이 브라우저에만 저장돼요. config.js에 주소와 키를 넣으면 클라우드 저장과 공개 기능을 쓸 수 있어요.</div></div>`;
return`<h2>클라우드 · 공개</h2><div class="card"><div class="lab">관리자로 로그인됨</div><div class="note">기록은 Supabase에 저장되고, 같은 계정으로 로그인하면 어느 기기에서든 볼 수 있어요.</div><div class="row" style="margin-top:10px"><button class="btn sec" onclick="importLocal()">이 브라우저 기록 가져오기 (${LOCAL.rounds.length}건)</button><button class="btn sec" onclick="logout()">로그아웃</button></div><div class="note">가져와도 이 브라우저의 기존 기록은 지우지 않아요.</div></div>`}
const pubCard=r=>{const o=r.score-(r.par||72);return`<div class="card"><div class="lab">${fd(r.date)}</div><h3>${esc(r.course)}</h3><div class="n" style="font-size:38px">${r.score} <span class="lab">${o>=0?'+':''}${o} (파 ${r.par||72})</span></div>${(r.mates||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}${r.photos?.length?`<div class="photos" style="margin-top:10px">${r.photos.map((p,i)=>`<div style="background-image:url(${ps(p)})" onclick="zoom('${r.id}',${i})"></div>`).join('')}</div>`:''}${r.good?`<p style="white-space:pre-wrap"><b>What Went Well</b><br>${esc(r.good)}</p>`:''}${r.bad?`<p style="white-space:pre-wrap"><b>What Could Be Better</b><br>${esc(r.bad)}</p>`:''}${r.goals?.length?`<p><b>Next Round Goals</b><br>${r.goals.map(g=>'· '+esc(g)).join('<br>')}</p>`:''}</div>`};
V.pub=()=>{const a=ROLE=='admin';return`<div class="top"><div><h1>My Golf Diary</h1><p>Every round has a story.</p></div>${a?`<button class="btn sec" onclick="go('home')">관리자 화면</button>`:''}</div>${a?'<div class="status">공개 페이지 미리보기예요. 방문자에게 보이는 모습 그대로예요.</div>':''}${BOOTERR?`<div class="status">연결 문제: ${esc(BOOTERR)}</div>`:''}<div style="margin-top:14px">${PUB.length?PUB.map(pubCard).join(''):`<div class="card empty">${BALL}<p>아직 공개된 라운딩이 없어요.<br>곧 첫 이야기가 올라올 거예요.</p></div>`}</div>${a?'':`<p style="text-align:center;margin-top:24px"><a href="#" class="lab" onclick="go('login');return false">관리자 로그인</a></p>`}`};
V.login=()=>`<div class="top"><h1>관리자 로그인</h1><button class="ib" onclick="go('pub')" aria-label="뒤로">${I('l',20)}</button></div><div class="card" style="margin-top:14px"><label>이메일</label><input id="lg-email" type="email" autocomplete="username"><label>비밀번호</label><input id="lg-pw" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"><button class="btn" style="width:100%;margin-top:14px" onclick="login()">로그인</button></div>`;
boot();

function mapUI(){const e=$('#mp');if(!e)return;
if(!mapsEnabled){e.innerHTML=`<div class="status">${I('pin',18)}<span>지도 미리보기는 Google Maps API 연결이 필요해요. 아직 연결되지 않았어요.</span></div>`;return}
const p=F.place;e.innerHTML=p?`<div class="lab" style="margin-top:10px">${esc(p.address||'')}</div><a href="${mapLink(p.lat,p.lng)}" target="_blank" rel="noopener"><iframe class="map" loading="lazy" src="${embedUrl(p.lat,p.lng)}" title="골프장 위치" style="pointer-events:none"></iframe></a>`:`<div class="status">${I('pin',18)}<span>골프장을 검색해 선택하면 지도가 나타나요.</span></div>`}
let sgT;
function sgSearch(){clearTimeout(sgT);const t=$('#f-course').value.trim();if(!mapsEnabled||t.length<2){$('#sg').innerHTML='';return}
sgT=setTimeout(async()=>{try{window.SG=await suggest(t);$('#sg').innerHTML=SG.map((s,i)=>`<div class="sg" onclick="sgPick(${i})">${esc(s.text)}</div>`).join('')}catch(e){$('#sg').innerHTML='<div class="note">검색에 실패했어요. API 키와 Places API 설정을 확인해 주세요.</div>'}},350)}
async function sgPick(i){const s=SG[i];$('#sg').innerHTML='';try{const p=await pickPlace(s);F.place=p;$('#f-course').value=p.name;if(!$('#f-region').value)$('#f-region').value=p.region;mapUI();wxUI();draft()}catch(e){toast('장소 정보를 불러오지 못했어요.')}}
function wxUI(){const e=$('#wu');if(!e)return;e.innerHTML=`<div class="row" style="margin-top:10px;align-items:center"><button class="btn sec" style="flex:none" onclick="autoWx()">날씨 자동 조회</button><span class="note" style="margin:0">${esc(F.wxMsg||(F.place?'선택한 골프장 위치 기준 (Open-Meteo)':'골프장을 검색해 선택하면 조회할 수 있어요.'))}</span></div>`}
async function autoWx(){if(!F.place)return toast('먼저 골프장을 검색해 선택해 주세요.');const d=$('#f-date').value;if(!d)return toast('날짜를 선택해 주세요.');
F.wxMsg='조회 중…';wxUI();try{const w=await weatherFor(F.place.lat,F.place.lng,d);$('#f-wx').value=w.wx;$('#f-temp').value=w.temp;$('#f-wind').value=w.wind;F.wxMsg=`강수 ${w.precip}mm · 직접 수정할 수 있어요`;draft()}catch(e){F.wxMsg='조회에 실패했어요. 직접 입력해 주세요.'}wxUI()}
Object.assign(window,{go,tg,del,zoom,bkc,bkr,saveRound,addPh,hs,sum,addMate,addGoal,tags,goalsUI,photosUI,draft,render,sgSearch,sgPick,autoWx,mon});

function wxUI(){const e=$('#wu');if(e)e.innerHTML='<div class="status">'+I('cloud',18)+'<span>날씨 자동 조회는 날씨 API 연결이 필요해요. 지금은 직접 입력해 주세요.</span></div>'}
</script></body></html>
