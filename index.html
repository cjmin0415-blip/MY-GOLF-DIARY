<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><meta property="og:type" content="website"><meta property="og:title" content="JM's Green Book"><meta property="og:description" content="정민이의 필드 기록장 · 초대받은 분께만 열려 있어요"><meta property="og:image" content="https://cjmin0415-blip.github.io/MY-GOLF-DIARY/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="description" content="정민이의 필드 기록장"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B3%3C/text%3E%3C/svg%3E"><title>JM's Green Book</title>
<style>

:root{--bg:#FAF8F4;--card:#fff;--pri:#91A58E;--sec:#EEE9E1;--acc:#D9A58F;--tx:#343832;--mut:#8b8d85;--sh:0 2px 14px rgba(52,56,50,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 "Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:18px 18px 8px;animation:in .28s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1,h2,h3,.n{font-family:inherit;font-weight:600;margin:0}h1{font-size:24px}h2{font-size:17px;margin:26px 2px 10px}h3{font-size:15px;margin-bottom:8px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.lab{color:var(--mut);font-size:12.5px}.n{font-size:26px;line-height:1.15}.up{color:var(--pri)}.dn{color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:flex-start}.top p{margin:2px 0 0;color:var(--mut);font-style:normal;font-size:13px}
.ib{background:var(--sec);border:0;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;color:var(--tx);cursor:pointer}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st .card{margin:0;padding:12px 6px;text-align:center}
.rc{display:flex;gap:12px;align-items:center;cursor:pointer;padding:10px;transition:transform .15s}.rc:active{transform:scale(.98)}
.ph{width:84px;height:84px;border-radius:16px;background:var(--sec) center/cover;display:grid;place-items:center;color:var(--pri);flex:none}
.rc .b{flex:1;min-width:0}.rc .b b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rc .sc{text-align:right;padding-right:6px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:10px 16px;min-height:44px;cursor:pointer;transition:transform .12s,opacity .12s}.btn:active{transform:scale(.96);opacity:.85}.btn.sec{background:var(--sec);color:var(--tx)}.btn.del{background:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--sec);border-radius:12px;padding:11px 12px;min-height:44px}
label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 4px}.row{display:flex;gap:8px}.row>*{flex:1}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--sec);border-radius:99px;padding:4px 12px;margin:4px 6px 0 0;font-size:13px}.tag b{cursor:pointer;padding:0 2px}
.seg2{display:inline-flex;background:var(--sec);border-radius:99px;padding:3px;margin:4px 0 10px}.seg2 button{border:0;background:none;border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;min-height:34px;color:var(--mut)}.seg2 button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);border-top:1px solid var(--sec);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);cursor:pointer;min-width:56px;min-height:44px;position:relative}.nav button.on{color:var(--pri);font-weight:600}.nav button.on:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--pri);position:absolute;bottom:-5px}
.nav .plus{background:var(--pri);color:#fff;border-radius:50%;width:54px;height:54px;min-width:0;margin-top:-20px;justify-content:center;box-shadow:0 4px 14px rgba(145,165,142,.5)}.nav .plus:after{display:none}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -18px;padding:0 18px 6px}.hs>div{flex:none;width:130px;height:130px;border-radius:18px;background:var(--sec) center/cover;scroll-snap-align:start;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal>div{min-height:48px;cursor:pointer;border-radius:12px;padding-top:4px}.cal i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:13px}.cal .has i{background:var(--pri);color:#fff}.cal small{display:block;font-size:10px;color:var(--mut)}.cal .sel{background:var(--sec)}
.bar{height:8px;background:var(--sec);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.stars{display:flex;gap:2px;margin:2px 0 8px}.stars button{background:none;border:0;font-size:28px;line-height:1;color:#d9d3c7;padding:0 3px;min-height:0;cursor:pointer}.stars button.on{color:var(--acc)}.mealbox{background:var(--bg);border-radius:16px;padding:12px;margin-bottom:10px}.stv{color:var(--acc);letter-spacing:1px}.mrow{margin:8px 0}.q{font-size:17px;font-weight:600;margin:12px 0 0;line-height:1.45}.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.pg div{border-radius:14px;background:var(--sec) center/cover;cursor:pointer}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos div{aspect-ratio:1;border-radius:14px;background:var(--sec) center/cover;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(30,32,28,.88);z-index:9;display:grid;place-items:center;padding:16px;color:#fff;text-align:center}.ov img{max-width:100%;max-height:80vh;border-radius:14px}
.empty{text-align:center;color:var(--mut);padding:26px 12px}.empty svg{margin-bottom:6px}
.status{display:flex;gap:10px;align-items:center;background:var(--sec);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mut);margin-top:10px}
.big{width:100%;font-family:inherit;font-size:44px;text-align:center;border:0;background:var(--bg);padding:10px;border-radius:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--tx);color:#fff;padding:9px 18px;border-radius:99px;z-index:10;font-size:13px;animation:in .2s}
.note{font-size:12px;color:var(--mut);margin-top:6px}svg text{fill:var(--mut);font-size:10px}summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sg{background:var(--card);border:1px solid var(--sec);border-radius:12px;padding:10px 12px;margin-top:4px;font-size:14px;cursor:pointer}.sg:active{background:var(--sec)}.map{width:100%;height:150px;border:0;border-radius:14px;margin-top:8px;display:block}
.hero2{overflow:visible;background:linear-gradient(135deg,#91A58E,#b7c8b2);color:#fff;border-radius:22px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin:30px 0 4px;box-shadow:var(--sh)}.hero2 .lab{color:rgba(255,255,255,.88)}.hero2 b{font-size:17px}.hero2 .hb{font-size:46px;line-height:1}
.st .em{font-size:22px;line-height:1;margin-bottom:4px}
.scimg{width:100%;aspect-ratio:4/3;border-radius:14px;background:var(--sec) center/contain no-repeat;cursor:pointer;margin:8px 0}
.vr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--sec);font-size:14.5px}.vr .seg2{margin:0;flex:none}.vr .seg2 button{padding:5px 10px;font-size:12.5px;min-height:32px}
.pn{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 12px}.pn .ib{width:34px;height:34px}
.lr{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer}.dc{width:46px;height:46px;border-radius:14px;background:var(--sec);display:grid;place-items:center;text-align:center;line-height:1.1;flex:none}.dc b{font-size:17px}.dc small{font-size:10px;color:var(--mut)}
.lm{flex:1;min-width:0}.lm>b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chips span{font-size:11.5px;background:var(--bg);border-radius:99px;padding:2px 8px;color:var(--mut)}
.la{font-weight:700;color:#b9755a;white-space:nowrap}.mh{display:flex;justify-content:space-between;margin:16px 4px 6px;font-size:13px;color:var(--mut)}
.cb{margin:12px 0}.cr{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
</style></head><body>

async function importLocal(){const ex=new Set(D.rounds.map(r=>r.id)),todo=LOCAL.rounds.filter(r=>!ex.has(r.id));if(!todo.length)return toast('가져올 새 기록이 없어요.');if(!confirm(`${todo.length}건을 클라우드로 가져올까요? 이 브라우저의 기록은 그대로 유지돼요. 가져온 기록은 모두 비공개로 시작해요.`))return;let n=0;for(const r of todo){try{const c=structuredClone(r);c.pub=false;c.vis={};toast(`가져오는 중… ${n+1}/${todo.length}`);await cloudSave(c);D.rounds.push(c);n++}catch(e){toast('중간에 실패했어요: '+(e.message||e));break}}toast(`${n}건 가져왔어요`);render()}
const VIS=[['date','날짜'],['teeoff','티오프 시간'],['course','골프장'],['score','스코어 (전반·후반)'],['scorecard','스코어 카드 사진'],['weather','날씨'],['cost','금액'],['mates','동반자'],['meals','식사 기록 (19th Hole)'],['photos','사진'],['oneline','오늘의 한 줄'],['good','잘된 점'],['bad','아쉬운 점'],['next','다음에 유념할 것']];
function visUI(){const row=([k,l])=>{const c=F.vis[k],b=(val,txt,on)=>`<button class="${on?'on':''}" onclick="setVis('${k}',${val})">${txt}</button>`;return`<div class="vr"><span>${l}</span><div class="seg2">${b('false','비공개',!c)}${k=='mates'?b("'mask'",'가림',c==='mask'):''}${b('true','공개',c===true)}</div></div>`};
return`<div class="note" style="margin:0 0 6px">항목마다 따로 정해요. 하나도 공개하지 않으면 방문자에게 보이지 않아요.${F.vis.mates==='mask'?' 동반자는 이**처럼 이름이 가려져요.':''}</div>${VIS.map(row).join('')}<div class="row" style="margin-top:10px"><button class="btn sec" onclick="allVis(true)">모두 공개</button><button class="btn sec" onclick="allVis(false)">모두 비공개</button></div>`}
function setVis(k,val){F.vis[k]=val;F.pub=anyVis(F.vis);$('#vz').innerHTML=visUI()}
function allVis(b){VIS.forEach(([k])=>F.vis[k]=b);F.pub=b;$('#vz').innerHTML=visUI()}
function cloudCard(){if(!SB)return`<h2>클라우드</h2><div class="card"><div class="note" style="margin:0">Supabase가 설정되지 않아 이 브라우저에만 저장돼요. config.js에 주소와 키를 넣으면 클라우드 저장과 공개 기능을 쓸 수 있어요.</div></div>`;
return`<h2>링크로 공유하기</h2><div class="card"><div class="note" style="margin:0 0 8px">방문자는 아래에서 만든 링크로만 볼 수 있어요. 링크마다 유효기간과 폐기를 정할 수 있어요.</div><label>받는 분 메모 (나만 보여요)</label><input id="sh-label" placeholder="예: 김민지"><label>유효기간</label><select id="sh-days"><option value="1">1일</option><option value="7" selected>7일</option><option value="30">30일</option><option value="90">90일</option></select><label style="display:flex;gap:8px;align-items:center;margin-top:10px;color:inherit"><input id="sh-bind" type="checkbox" checked style="width:auto;min-height:0"> 처음 연 기기 1대에서만 열리게 (전달 방지)</label><button class="btn" style="width:100%;margin-top:12px" onclick="shMake()">링크 만들고 복사</button></div><div id="shl" style="margin-top:10px"></div><h2>클라우드 · 공개</h2><div class="card"><div class="lab">관리자로 로그인됨</div><div class="note">기록은 Supabase에 저장되고, 같은 계정으로 로그인하면 어느 기기에서든 볼 수 있어요.</div><div class="row" style="margin-top:10px"><button class="btn sec" onclick="importLocal()">이 브라우저 기록 가져오기 (${LOCAL.rounds.length}건)</button><button class="btn sec" onclick="logout()">로그아웃</button></div><div class="note">가져와도 이 브라우저의 기존 기록은 지우지 않아요.</div></div>`}
V.pub=()=>V.home();
const DMSG={none:['초대받은 분만 볼 수 있어요','이 주소에는 초대 코드가 없어요. 받은 링크 전체(주소 끝 ?k= 포함)로 다시 열어 주세요.'],invalid:['링크를 확인할 수 없어요','링크가 잘못됐거나 삭제됐어요. 주소 끝의 ?k= 부분이 잘리지 않았는지 확인하고, 계속 안 되면 보내준 분께 새 링크를 요청해 주세요.'],expired:['링크 유효기간이 지났어요','보내준 분께 새 링크를 요청해 주세요.'],revoked:['더 이상 열 수 없는 링크예요','공유가 종료됐어요. 보내준 분께 문의해 주세요.'],device:['이미 다른 기기에서 열린 링크예요','이 링크는 처음 연 기기 1대에서만 볼 수 있어요. 보내준 분께 새 링크를 요청해 주세요.'],error:['연결에 문제가 있어요','잠시 후 다시 시도해 주세요.']};
V.denied=()=>{const m=DMSG[DENY]||DMSG.invalid;return`<div class="top"><div><h1>⛳ JM's Green Book</h1><p>정민이의 필드 기록장</p></div></div><div class="card empty" style="margin-top:18px">${MASCOT(170,'margin:0 auto 10px')}<p><b>${m[0]}</b><br>${m[1]}</p>${BOOTERR?`<p class="note">${esc(BOOTERR)}</p>`:''}</div><p style="text-align:center;margin-top:24px"><a href="#" class="lab" onclick="go('login');return false">관리자 로그인</a></p>`};
const SHB=()=>location.href.split('#')[0].split('?')[0];
const rnd=()=>{const a=new Uint8Array(18);crypto.getRandomValues(a);return[...a].map(x=>(x%36).toString(36)).join('')};
const shSt=l=>l.revoked?'폐기됨':new Date(l.expires_at)<new Date()?'만료됨':(l.bind&&l.device?'사용 중 (1대 고정)':'대기 중');
async function shareList(){const e=$('#shl');if(!e||!SB)return;const{data,error}=await SB.from('share_links').select('*').order('created_at',{ascending:false});if(error){e.innerHTML='<div class="note">목록을 불러오지 못했어요: '+esc(error.message)+'<br>supabase_update.sql을 먼저 실행해 주세요.</div>';return}
e.innerHTML=(data||[]).length?data.map(l=>`<div class="mealbox"><b>${esc(l.label||'이름 없음')}</b> <span class="tag" style="margin:0 0 0 4px">${shSt(l)}</span><div class="lab">${String(l.expires_at).slice(0,10)}까지${l.bind?' · 처음 연 기기 1대만':''}</div><div class="row" style="margin-top:8px"><button class="btn sec" onclick="shCopy('${l.token}')">링크 복사</button>${l.revoked?'':`<button class="btn sec" onclick="shRevoke('${l.token}')">폐기</button>`}<button class="btn sec" onclick="shDel('${l.token}')">삭제</button></div></div>`).join(''):'<div class="note">만든 링크가 아직 없어요.</div>'}
function shCopy(t){const u=SHB()+'?k='+t;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('링크를 복사했어요'),()=>prompt('링크를 복사해 주세요',u))}
async function shMake(){const d=+$('#sh-days').value,label=$('#sh-label').value.trim(),bind=$('#sh-bind').checked,token=rnd(),exp=new Date(Date.now()+d*864e5).toISOString();const{error}=await SB.from('share_links').insert({token,label,expires_at:exp,bind});if(error)return toast('만들지 못했어요: '+error.message);$('#sh-label').value='';await shareList();shCopy(token)}
async function shRevoke(t){if(!confirm('이 링크를 폐기할까요? 받은 사람은 더 이상 볼 수 없어요.'))return;await SB.from('share_links').update({revoked:true}).eq('token',t);shareList()}
async function shDel(t){if(!confirm('이 링크를 목록에서 삭제할까요?'))return;await SB.from('share_links').delete().eq('token',t);shareList()}
V.login=()=>`<div class="top"><h1>관리자 로그인</h1><button class="ib" onclick="go('home')" aria-label="뒤로">${I('l',20)}</button></div><div class="card" style="margin-top:14px"><label>이메일</label><input id="lg-email" type="email" autocomplete="username"><label>비밀번호</label><input id="lg-pw" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"><button class="btn" style="width:100%;margin-top:14px" onclick="login()">로그인</button></div>`;
boot();

function mapUI(){const e=$('#mp');if(!e)return;
if(!mapsEnabled){e.innerHTML=`<div class="status">${I('pin',18)}<span>지도 미리보기는 Google Maps API 연결이 필요해요. 아직 연결되지 않았어요.</span></div>`;return}
const p=F.place;e.innerHTML=p?`<div class="lab" style="margin-top:10px">${esc(p.address||'')}</div><a href="${mapLink(p.lat,p.lng)}" target="_blank" rel="noopener"><iframe class="map" loading="lazy" src="${embedUrl(p.lat,p.lng)}" title="골프장 위치" style="pointer-events:none"></iframe></a>`:`<div class="status">${I('pin',18)}<span>골프장을 검색해 선택하면 지도가 나타나요.</span></div>`}
let sgT;
function sgSearch(){clearTimeout(sgT);const t=$('#f-course').value.trim();if(!mapsEnabled||t.length<2){$('#sg').innerHTML='';return}
sgT=setTimeout(async()=>{try{window.SG=await suggest(t);$('#sg').innerHTML=SG.map((s,i)=>`<div class="sg" onclick="sgPick(${i})">${esc(s.text)}</div>`).join('')}catch(e){$('#sg').innerHTML='<div class="note">검색에 실패했어요. API 키와 Places API 설정을 확인해 주세요.</div>'}},350)}
async function sgPick(i){const s=SG[i];$('#sg').innerHTML='';try{const p=await pickPlace(s);F.place=p;$('#f-course').value=p.name;if(!$('#f-region').value)$('#f-region').value=p.region;mapUI();wxUI();draft()}catch(e){toast('장소 정보를 불러오지 못했어요.')}}
function wxUI(){const e=$('#wu');if(!e)return;e.innerHTML=`<div class="row" style="margin-top:10px;align-items:center"><button class="btn sec" style="flex:none" onclick="autoWx()">날씨 자동 조회</button><span class="note" style="margin:0">${esc(F.wxMsg||(F.place?'선택한 골프장 위치 기준 (Open-Meteo)':'골프장을 검색해 선택하면 조회할 수 있어요.'))}</span></div>`}
async function autoWx(){if(!F.place)return toast('먼저 골프장을 검색해 선택해 주세요.');const d=$('#f-date').value;if(!d)return toast('날짜를 선택해 주세요.');
F.wxMsg='조회 중…';wxUI();try{const w=await weatherFor(F.place.lat,F.place.lng,d);$('#f-wx').value=w.wx;$('#f-temp').value=w.temp;$('#f-wind').value=w.wind;F.wxMsg=`강수 ${w.precip}mm · 직접 수정할 수 있어요`;draft()}catch(e){F.wxMsg='조회에 실패했어요. 직접 입력해 주세요.'}wxUI()}
Object.assign(window,{moreHome,shareList,shCopy,shMake,shRevoke,shDel,mealsUI,exitPv,previewPub,go,tg,del,zoom,bkc,bkr,saveRound,addPh,hs,sum,addMate,addGoal,tags,goalsUI,photosUI,draft,render,sgSearch,sgPick,autoWx,mon});

function wxUI(){const e=$('#wu');if(e)e.innerHTML='<div class="status">'+I('cloud',18)+'<span>날씨 자동 조회는 날씨 API 연결이 필요해요. 지금은 직접 입력해 주세요.</span></div>'}
